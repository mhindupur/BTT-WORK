services:
  mysql:
    image: mysql:8.4
    container_name: btt-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: btt
      MYSQL_USER: btt
      MYSQL_PASSWORD: btt
      MYSQL_ROOT_PASSWORD: btt-root-local-only
    # Use 3307 on the host if you already have MySQL on localhost:3306
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbtt-root-local-only"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
